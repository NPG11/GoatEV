[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["goatev_engine"]

[project]
name = "goatev-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["treys", "anthropic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
